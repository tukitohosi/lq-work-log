<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>记工本 · 手机预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf0ec;color:#203c31;font-family:system-ui,"Microsoft YaHei",sans-serif}.preview-head{max-width:900px;margin:0 auto;padding:20px 20px 14px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:20px;margin:0 0 5px}p{font-size:13px;margin:0;color:#63746c}label{display:flex;align-items:center;gap:10px;font-size:13px}select{border:1px solid #b6c5bd;border-radius:9px;padding:9px;color:inherit;background:white}.preview-frame{display:block;box-sizing:content-box;width:390px;max-width:calc(100% - 14px);height:calc(100dvh - 108px);min-height:550px;margin:0 auto;border:7px solid #263c32;border-radius:24px;background:white;box-shadow:0 15px 44px #193c2520}footer{text-align:center;padding:8px;font-size:12px;color:#63746c}@media(max-width:500px){.preview-frame{max-width:100%;border-width:0;border-radius:0;height:calc(100dvh - 125px);min-height:400px}.preview-head{padding:12px}}
</style></head>
<body><header class="preview-head"><div><h1>记工本 · 手机预览</h1><p>使用独立示例数据，可以自由点选、编辑和新增工地。</p></div><label>屏幕宽度<select id="width"><option>320</option><option>360</option><option selected>390</option><option>412</option><option>430</option></select></label></header><iframe class="preview-frame" id="phone" src="/" title="可操作的记工本手机版"></iframe><footer>点击日期记工 · 编辑资料中可新增默认工地</footer><script>document.getElementById('width').addEventListener('change',event=>{document.getElementById('phone').style.width=Number(event.target.value)+'px'});document.getElementById('phone').style.width='390px'</script></body></html>
